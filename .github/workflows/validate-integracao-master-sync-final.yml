name: Validate final Master sync integration

on:
  push:
    branches:
      - integracao/master-sync-final
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-integracao-master-sync-final
  cancel-in-progress: true

jobs:
  test-build-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pin stable npm version
        run: npm install --global npm@10.8.2

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Type-check (extra step for this integration branch)
        run: npx tsc --noEmit
